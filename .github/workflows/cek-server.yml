name: cek-server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - name: Cek kondisi server (hanya baca)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "== HOME =="; pwd; echo $HOME
            echo "== isi home =="; ls -la ~ | head -40
            echo "== kandidat folder domain =="; ls -d ~/public_html ~/domains/* ~/*/public ~/finance* ~/*kalanalabs* 2>/dev/null
            echo "== folder yang punya artisan =="; find ~ -maxdepth 4 -name artisan -not -path "*/vendor/*" 2>/dev/null
            echo "== cron =="; crontab -l 2>&1 | head
